name: Prebuild Dev Container

on:
  push:
    branches: [master]
    paths:
      - 'dapr-containerapps/**'
      - '.github/workflows/prebuild-devcontainer.yml'

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: devcontainers/ci@v0.3
        with:
          subFolder: dapr-containerapps
          imageName: ghcr.io/piotr1215/dapr-containerapps
          cacheFrom: ghcr.io/piotr1215/dapr-containerapps
          platform: linux/amd64
          push: always
